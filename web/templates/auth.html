<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SpendGuard AI — Agent Cost Control Layer</title>

<!-- Fonts: Instrument Serif, Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #fbfaf8;
    --ink: #141412;
    --muted: #73726c;
    --line: rgba(20, 20, 18, 0.08);
    --line-focus: #141412;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background-color: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* 50/50 Split Viewport */
  .auth-viewport {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
    width: 100%;
  }

  @media (max-width: 900px) {
    .auth-viewport { grid-template-columns: 1fr; }
    .auth-hero { display: none !important; }
  }

  /* -------------------------------------------------------------------
     LEFT: MINIMAL FORM PANE
     ------------------------------------------------------------------- */
  .auth-form-pane {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px 6vw;
    background: var(--paper);
  }

  .brand {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-decoration: none;
    color: var(--ink);
  }

  .form-wrap {
    max-width: 360px;
    width: 100%;
    margin: 0 auto;
  }

  .form-title {
    font-family: var(--serif);
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 24px;
  }
  .form-title em { font-style: italic; }

  /* Minimal Tab Switcher */
  .auth-tabs {
    display: inline-flex;
    gap: 16px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--line);
    width: 100%;
  }

  .auth-tab {
    padding: 8px 0;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    position: relative;
    transition: color 0.15s ease;
  }
  .auth-tab:hover { color: var(--ink); }

  .auth-tab.active {
    color: var(--ink);
    font-weight: 600;
  }
  .auth-tab.active::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--ink);
  }

  .auth-alert {
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 18px;
    display: none;
    line-height: 1.4;
  }
  .auth-alert.error {
    display: block;
    background: #fff1f2;
    color: #e11d48;
    border: 1px solid rgba(225, 29, 72, 0.15);
  }
  .auth-alert.success {
    display: block;
    background: #f0fdf4;
    color: #15803d;
    border: 1px solid rgba(21, 128, 61, 0.15);
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .form-input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #ffffff;
    font-family: var(--sans);
    font-size: 0.92rem;
    color: var(--ink);
    outline: none;
    transition: all 0.15s ease;
  }

  .form-input:focus {
    border-color: var(--line-focus);
    box-shadow: 0 0 0 3px rgba(20, 20, 18, 0.05);
  }

  .form-input::placeholder {
    color: #a8a6a1;
  }

  .btn-submit {
    width: 100%;
    padding: 12px 18px;
    border-radius: 6px;
    background: var(--ink);
    color: #ffffff;
    border: 1px solid var(--ink);
    font-family: var(--sans);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
    transition: all 0.15s ease;
  }

  .btn-submit:hover {
    background: #2b2b27;
  }

  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .auth-footer {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .auth-footer a {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* -------------------------------------------------------------------
     RIGHT: MINIMAL HERO IMAGE
     ------------------------------------------------------------------- */
  .auth-hero {
    position: relative;
    background: #1c1c1a url('/static/images/auth-gateway-vault.png') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 56px;
  }

  .auth-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20, 20, 18, 0.1) 0%, rgba(20, 20, 18, 0.7) 100%);
    z-index: 1;
  }

  .hero-quote-box {
    position: relative;
    z-index: 2;
    max-width: 440px;
  }

  .hero-quote {
    font-family: var(--serif);
    font-size: 2.4rem;
    line-height: 1.15;
    font-weight: 400;
    color: #ffffff;
    letter-spacing: -0.01em;
  }
  .hero-quote em { font-style: italic; color: #f2eee6; }
</style>
</head>
<body>

<div class="auth-viewport">

  <!-- LEFT: Form Pane -->
  <div class="auth-form-pane">
    <a href="/" class="brand">SpendGuard</a>

    <div class="form-wrap">
      <h1 class="form-title" id="pane-title">Sign <em>in</em></h1>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-signin" onclick="switchAuthTab('signin')">Sign in</div>
        <div class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Create account</div>
      </div>

      <div class="auth-alert" id="auth-alert"></div>

      <!-- Sign In -->
      <form id="form-signin" action="/auth/signin" method="POST">
        <div class="form-group">
          <label class="form-label" for="signin-email">Email</label>
          <input type="email" id="signin-email" name="email" class="form-input" placeholder="name@company.com" required autofocus />
        </div>

        <div class="form-group">
          <label class="form-label" for="signin-password">Password</label>
          <input type="password" id="signin-password" name="password" class="form-input" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-submit" id="btn-signin-submit">Continue &rarr;</button>
      </form>

      <!-- Sign Up -->
      <form id="form-signup" onsubmit="handleSignUp(event)" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="form-input" placeholder="Ada Lovelace" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email</label>
          <input type="email" id="signup-email" class="form-input" placeholder="name@company.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <input type="password" id="signup-password" class="form-input" placeholder="Min. 8 characters" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-confirm">Confirm Password</label>
          <input type="password" id="signup-confirm" class="form-input" placeholder="Repeat password" required />
        </div>

        <button type="submit" class="btn-submit" id="btn-signup-submit">Create Account &rarr;</button>
      </form>
    </div>

    <div class="auth-footer">
      By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    </div>
  </div>

  <!-- RIGHT: Minimal Hero Image -->
  <div class="auth-hero">
    <div class="hero-quote-box">
      <h2 class="hero-quote">
        “Hard spend limits and <em>runaway protection</em> for AI agents.”
      </h2>
    </div>
  </div>

</div>

<script>
  function switchAuthTab(tab) {
    const isSignIn = tab === 'signin';
    document.getElementById('tab-signin').classList.toggle('active', isSignIn);
    document.getElementById('tab-signup').classList.toggle('active', !isSignIn);
    document.getElementById('form-signin').style.display = isSignIn ? 'block' : 'none';
    document.getElementById('form-signup').style.display = isSignIn ? 'none' : 'block';
    document.getElementById('pane-title').innerHTML = isSignIn ? 'Sign <em>in</em>' : 'Create <em>account</em>';
    
    const alertBox = document.getElementById('auth-alert');
    alertBox.style.display = 'none';
    alertBox.className = 'auth-alert';
  }

  async function handleSignUp(e) {
    e.preventDefault();
    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm').value;
    const alertBox = document.getElementById('auth-alert');
    const btn = document.getElementById('btn-signup-submit');

    if (password !== confirm) {
      alertBox.textContent = 'Passwords do not match.';
      alertBox.className = 'auth-alert error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      const resp = await fetch('/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, confirm_password: confirm }),
      });
      const data = await resp.json();

      if (resp.status === 202) {
        alertBox.className = 'auth-alert success';
        alertBox.textContent = data.message || 'Check your email to confirm your account.';
        return;
      }

      if (!resp.ok) {
        throw new Error(data.error || 'Account creation failed.');
      }

      window.location.href = '/dashboard';
    } catch (err) {
      alertBox.className = 'auth-alert error';
      alertBox.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Account \u2192';
    }
  }

  const urlParams = new URLSearchParams(window.location.search);
  const errorParam = urlParams.get('error');
  if (errorParam) {
    const alertBox = document.getElementById('auth-alert');
    alertBox.className = 'auth-alert error';
    alertBox.textContent = decodeURIComponent(errorParam);
  }
</script>
</body>
</html>
